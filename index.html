<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stemora Academy — Grade 10 CBC / CBE Visual STEM &amp; Study Hub</title>
  <!-- Custom Colorful Circular "S" Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='ke' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2310b981'/%3E%3Cstop offset='50%25' stop-color='%23ef4444'/%3E%3Cstop offset='100%25' stop-color='%23f59e0b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='%23070a10' stroke='url(%23ke)' stroke-width='4.5'/%3E%3Ctext x='32' y='44' font-family='Arial, sans-serif' font-size='35' font-weight='900' fill='url(%23ke)' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #070a0f;
      --surface: #101622;
      --surface-alt: #172033;
      --border: #25324b;
      --green: #10b981;
      --green-dark: #059669;
      --red: #ef4444;
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #0f1f1c 0%, var(--bg) 50%);
      color: var(--text);
      line-height: 1.6;
    }

    /* Kenyan Flag Top Accent Stripe */
    .ke-ribbon {
      height: 5px;
      background: linear-gradient(90deg, #000000 0%, #000000 30%, #ffffff 32%, #bb0000 34%, #bb0000 66%, #ffffff 68%, #006600 70%, #006600 100%);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7, 10, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 900;
    }
    .brand-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: conic-gradient(from 45deg, var(--green), var(--gold), var(--red), var(--green));
      padding: 2.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-circle span {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      font-size: 1.1rem;
      font-weight: 900;
    }
    .brand-text em { font-style: normal; color: var(--green); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.92rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--green); }

    /* Hero */
    .hero {
      max-width: 1140px;
      margin: 0 auto;
      padding: 3.8rem 1.5rem 2.8rem;
      text-align: center;
    }
    .cbc-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 0.38rem 1rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
    }
    .hero h1 {
      font-size: clamp(2.1rem, 4.5vw, 3.4rem);
      font-weight: 900;
      line-height: 1.12;
      margin-bottom: 1rem;
    }
    .hero h1 span { color: var(--green); }
    .hero p {
      max-width: 680px;
      margin: 0 auto 1.8rem;
      color: var(--muted);
      font-size: 1.06rem;
    }
    .hero-cta {
      display: flex;
      justify-content: center;
      gap: 0.9rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .search-bar {
      max-width: 580px;
      margin: 0 auto;
    }
    .search-bar input {
      width: 100%;
      padding: 0.95rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
    }
    .search-bar input:focus { outline: none; border-color: var(--green); }

    /* Pathway Strip */
    .pathways {
      max-width: 1140px;
      margin: 0 auto 1rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem;
    }
    .pathway-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--green);
      border-radius: 10px;
      padding: 1rem 1.2rem;
    }
    .pathway-card.red { border-left-color: var(--red); }
    .pathway-card.gold { border-left-color: var(--gold); }
    .pathway-card strong { display: block; font-size: 0.98rem; margin-bottom: 0.2rem; }
    .pathway-card span { color: var(--muted); font-size: 0.84rem; }

    /* Sections */
    section { max-width: 1140px; margin: 0 auto; padding: 2.8rem 1.5rem; }
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.6rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .sec-head h2 { font-size: 1.75rem; font-weight: 800; }
    .sec-head p { color: var(--muted); }

    /* Filters */
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.48rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--green);
      color: #042f2e;
      border-color: var(--green);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(305px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--green); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
    }
    .tag {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
    }
    .price { font-size: 0.95rem; font-weight: 800; color: var(--gold); }
    .price.free { color: var(--green); }
    .card h3 { font-size: 1.18rem; margin-bottom: 0.3rem; }
    .author-line { font-size: 0.8rem; color: #34d399; font-weight: 700; margin-bottom: 0.6rem; }
    .card p { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.3rem; }
    .card-actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 0.65rem; }

    .btn {
      display: inline-block;
      padding: 0.78rem 1.1rem;
      border-radius: 9px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
      text-align: center;
    }
    .btn-primary { background: var(--green); color: #042f2e; }
    .btn-primary:hover { background: var(--green-dark); color: #fff; }
    .btn-outline { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--green); }

    /* Interactive CBC Quiz Box */
    .quiz-box {
      background: linear-gradient(135deg, #101827 0%, #0d1b18 100%);
      border: 1px solid var(--green);
      border-radius: 16px;
      padding: 2rem;
    }
    .quiz-q { font-size: 1.15rem; font-weight: 700; margin: 1rem 0; }
    .quiz-options { display: grid; gap: 0.7rem; margin-bottom: 1rem; }
    .quiz-opt {
      text-align: left;
      padding: 0.85rem 1rem;
      border-radius: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .quiz-opt:hover { border-color: var(--green); }
    .quiz-feedback {
      padding: 0.9rem 1rem;
      border-radius: 8px;
      font-size: 0.92rem;
      display: none;
      margin-bottom: 1rem;
    }

    /* Creator Form */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1.2rem;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.85rem;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    textarea { grid-column: 1 / -1; min-height: 95px; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--green);
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      padding: 1.8rem;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
